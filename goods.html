<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Wind Wing（結城朱煉）のオリジナルグッズ販売ショップ一覧。">
  <title>グッズ | Wind Wing</title>

  <style>
    :root {
      --white: #FFFFFF;
      --gray: #E9EDF0;
      --light-blue: #DCEAF5;
      --blue-green: #D9EFEB;
      --teal: #397D79;
      --text: #344C5D;
      --sub-text: #71818D;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--white);
      color: var(--text);
      font-family: "Yu Gothic", "Meiryo", sans-serif;
      line-height: 1.8;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1100px, 90%);
      margin: 0 auto;
    }

    header {
      background: var(--white);
      border-bottom: 1px solid var(--gray);
    }

    .header-inner {
      min-height: 85px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      color: var(--teal);
      font-size: 27px;
      font-weight: bold;
      letter-spacing: 4px;
    }

    .home-link {
      color: var(--sub-text);
      font-size: 13px;
      letter-spacing: 1px;
    }

    .home-link:hover {
      color: var(--teal);
    }

    .hero {
      background: linear-gradient(135deg, #F4F9FB, #EAF6F2);
      text-align: center;
      padding: 85px 20px;
    }

    .hero-label {
      color: var(--teal);
      font-size: 12px;
      letter-spacing: 4px;
    }

    h1 {
      font-size: 38px;
      letter-spacing: 5px;
      margin: 15px 0;
    }

    .hero-description {
      color: var(--sub-text);
      font-size: 14px;
    }

    .shop-section {
      padding: 75px 0 90px;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    .shop-card {
      border: 1px solid var(--gray);
      border-radius: 16px;
      padding: 35px 25px;
      background: #F7FAFC;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-height: 260px;
      transition: 0.25s;
    }

    .shop-card:nth-child(2) {
      background: #F1F8F7;
    }

    .shop-card:hover {
      transform: translateY(-5px);
      border-color: var(--teal);
      box-shadow: 0 10px 25px rgba(57, 125, 121, 0.1);
    }

    .shop-icon {
      font-size: 36px;
      margin-bottom: 15px;
    }

    .shop-card h2 {
      font-size: 24px;
      margin: 0 0 10px;
    }

    .shop-card p {
      color: var(--sub-text);
      font-size: 13px;
      margin: 0 0 25px;
    }

    .shop-button {
      margin-top: auto;
      background: var(--light-blue);
      color: var(--teal);
      border-radius: 30px;
      padding: 9px 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .back-area {
      text-align: center;
      margin-top: 55px;
    }

    .back-button {
      display: inline-block;
      border: 1px solid var(--teal);
      color: var(--teal);
      border-radius: 30px;
      padding: 12px 30px;
      font-size: 13px;
    }

    .back-button:hover {
      background: var(--blue-green);
    }

    footer {
      border-top: 1px solid var(--gray);
      text-align: center;
      padding: 30px 15px;
      color: var(--sub-text);
      font-size: 12px;
    }

    @media (max-width: 800px) {
      .shop-grid {
        grid-template-columns: 1fr;
      }

      .shop-card {
        min-height: 220px;
      }

      .logo {
        font-size: 21px;
      }

      h1 {
        font-size: 30px;
      }

      .hero {
        padding: 60px 20px;
      }
    }
  </style>

<!-- Google Analytics (Wind Wing) -->

  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

</script>
</head>

<body>

  <header>
    <div class="container header-inner">
      <a class="logo" href="index.html">Wind Wing</a>
      <a class="home-link" href="index.html">HOME</a>
    </div>
  </header>

  <main>

    <section class="hero">
      <div class="hero-label">ORIGINAL GOODS</div>
      <h1>グッズ</h1>
      <p class="hero-description">
        オリジナルキャラクターや創作作品のグッズを販売しています。<br>
        お気に入りの作品を見つけてもらえたら嬉しいです。
      </p>
    </section>

    <section class="shop-section">
      <div class="container">

        <div class="shop-grid">

          <a class="shop-card"
             href="https://suzuri.jp/syurenn0817"
             target="_blank"
             rel="noopener noreferrer">
            <div class="shop-icon">🎨</div>
            <h2>SUZURI</h2>
            <p>オリジナルグッズの販売ショップです。</p>
            <span class="shop-button">ショップを見る ↗</span>
          </a>

          <a class="shop-card"
             href="https://clubt.jp/100202"
             target="_blank"
             rel="noopener noreferrer">
            <div class="shop-icon">🎁</div>
            <h2>ClubT</h2>
            <p>オリジナルグッズの販売ショップです。</p>
            <span class="shop-button">ショップを見る ↗</span>
          </a>

          <a class="shop-card"
             href="https://syuren0817.booth.pm/"
             target="_blank"
             rel="noopener noreferrer">
            <div class="shop-icon">🛍️</div>
            <h2>BOOTH</h2>
            <p>オリジナル作品を取り扱うショップです。</p>
            <span class="shop-button">ショップを見る ↗</span>
          </a>

        </div>

        <div class="back-area">
          <a class="back-button" href="index.html">
            ← トップページに戻る
          </a>
        </div>

      </div>
    </section>

  </main>

  <footer>
    © 2026 Wind Wing / 結城朱煉
  </footer>

</body>
</html>
